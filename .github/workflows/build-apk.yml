name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Isi lewat: repo Settings -> Secrets and variables -> Actions -> New repository secret
      # Nama: KEYSTORE_BASE64  (isi: hasil base64 dari android/app/kasir.jks)
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode release keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 belum di-set. Tambahkan di"
            echo "::error::repo Settings -> Secrets and variables -> Actions."
            echo "::error::Isinya = seluruh isi file KEYSTORE_BASE64.txt di root project."
            exit 1
          fi
          # Buang semua spasi/baris baru/CR sebelum decode supaya tidak korup.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' \
            | base64 -d --ignore-garbage > android/app/kasir.jks
          echo "Keystore decoded: $(wc -c < android/app/kasir.jks) bytes"
          if ! keytool -list -keystore android/app/kasir.jks \
                -storepass "${KEYSTORE_PASSWORD:-kasirku123}" \
                -alias "${KEY_ALIAS:-kasirku}" >/dev/null 2>&1; then
            echo "::error::Keystore tidak bisa dibaca. Isi secret KEYSTORE_BASE64"
            echo "::error::kemungkinan kepotong saat copy. Salin ULANG seluruh isi"
            echo "::error::KEYSTORE_BASE64.txt (harus $(printf %s "$KEYSTORE_BASE64" | tr -d '[:space:]' | wc -c) char)."
            exit 1
          fi
          echo "Keystore OK."

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kasir-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kasir APK build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
